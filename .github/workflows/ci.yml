name: CI / CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-coverage:
    name: Rust Coverage (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 80

  rust-test:
    name: Rust Build & Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: Windows x64
            os: windows-latest
          - name: macOS ARM64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  typescript-quality:
    name: TypeScript Lint, Typecheck, Coverage (>= 80%) & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  release:
    name: Semantic Release (CD)
    needs:
      - rust-lint
      - rust-coverage
      - rust-test
      - typescript-quality
      - e2e
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: cd-release
      cancel-in-progress: false
    outputs:
      should_release: ${{ steps.semver.outputs.should_release }}
      release_tag: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate next semantic version
        id: semver
        run: node .github/scripts/release-semver.mjs --apply

      - name: Tag and publish GitHub Release
        if: steps.semver.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.semver.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.semver.outputs.previous_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
            git push origin HEAD:main
          fi

          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

          if [ -n "${PREVIOUS_TAG}" ]; then
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --notes-start-tag "${PREVIOUS_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

  publish-binaries:
    name: Build & Publish Desktop (${{ matrix.name }})
    needs: [release]
    if: needs.release.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            tauri_args: ""
          - name: Linux x64
            os: ubuntu-22.04
            tauri_args: ""
          - name: macOS Universal
            os: macos-latest
            tauri_args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libfuse2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install dependencies and build workspace packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Tauri desktop bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm --filter @openscale/desktop tauri build ${{ matrix.tauri_args }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          ASSETS=()
          while IFS= read -r file; do
            ASSETS+=("$file")
          done < <(find apps/desktop/src-tauri/target -type f \( \
            -path "*/release/bundle/nsis/*.exe" -o \
            -path "*/release/bundle/msi/*.msi" -o \
            -path "*/release/bundle/deb/*.deb" -o \
            -path "*/release/bundle/rpm/*.rpm" -o \
            -path "*/release/bundle/appimage/*.AppImage" -o \
            -path "*/release/bundle/dmg/*.dmg" \
          \))
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release bundles found!"
            exit 1
          fi
          echo "Uploading assets for ${RELEASE_TAG}:"
          printf '  - %s\n' "${ASSETS[@]}"
          gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber

[package]
name = "openscale-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "OpenScale cross-platform desktop application (Tauri v2)."

[lib]
name = "openscale_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openscale-app = { path = "../../../crates/openscale-app" }
openscale-domain = { path = "../../../crates/openscale-domain" }
openscale-driver = { path = "../../../crates/openscale-driver" }
openscale-storage = { path = "../../../crates/openscale-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7", "serde"] }
